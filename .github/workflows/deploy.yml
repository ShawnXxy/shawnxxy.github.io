name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm test

  deploy-static:
    needs: verify
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Check Copilot credentials
      env:
        COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      run: |
        if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
          echo "::error::Set the COPILOT_GITHUB_TOKEN repository secret with Copilot Requests permission."
          exit 1
        fi

    - name: Install generators and Copilot CLI
      run: |
        npm ci
        npm install --global @github/copilot@1.0.90 --no-fund --no-audit

    - name: Restore the last generated showcase
      uses: actions/cache/restore@v4
      with:
        path: static/data/github-showcase.json
        key: showcase-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          showcase-v1-${{ runner.os }}-

    - name: Generate public project and contribution summaries
      env:
        GH_TOKEN: ${{ secrets.GIT_TOKEN || github.token }}
        COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      run: npm run build-showcase

    - name: Cache the successful showcase snapshot
      uses: actions/cache/save@v4
      with:
        path: static/data/github-showcase.json
        key: showcase-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      
    - name: Inject Environment Variables
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const file = 'static/js/env-config.js';
        const source = fs.readFileSync(file, 'utf8');
        fs.writeFileSync(file, source.replaceAll(
          "'${AZURE_MAPS_SUBSCRIPTION_KEY}'",
          JSON.stringify(process.env.AZURE_MAPS_SUBSCRIPTION_KEY || '')
        ));
        NODE
      env:
        AZURE_MAPS_SUBSCRIPTION_KEY: ${{ secrets.AZURE_MAPS_SUBSCRIPTION_KEY }}
      
    - name: Setup Pages
      uses: actions/configure-pages@v5
      
    - name: Upload static files
      uses: actions/upload-pages-artifact@v3
      with:
        path: './static'
        
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: deploy-static
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      needs.deploy-static.result == 'success'
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      
    - name: Create deployment summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### ✅ Static Deployment Mode" >> $GITHUB_STEP_SUMMARY
        echo "- Deployed directly from \`static/\` folder" >> $GITHUB_STEP_SUMMARY
        echo "- No frontend build process required" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Deployment URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*Deployed automatically by GitHub Actions*" >> $GITHUB_STEP_SUMMARY
