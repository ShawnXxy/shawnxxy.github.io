name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      check_app_access:
        description: Check GitHub App access only, without generating or publishing
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}"
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm test

  verify-app-access:
    needs: verify
    runs-on: ubuntu-latest
    environment: showcase-data
    permissions:
      contents: read
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.check_app_access
    steps:
    - name: Checkout trusted collector
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Create app token for access check
      id: check-app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.SHOWCASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.SHOWCASE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        permission-contents: read
        permission-pull-requests: read

    - name: Verify GitHub App public data access
      env:
        GH_TOKEN: ${{ steps.check-app-token.outputs.token }}
      run: |
        node <<'NODE'
        const { collectProjects } = require('./scripts/generate-showcase-data');
        collectProjects().then(data => {
          console.log(JSON.stringify({
            windowStart: data.windowStart,
            generatedAt: data.generatedAt,
            projects: data.projects.map(project => ({
              repository: project.title,
              pinned: project.pinned,
              commitCount: project.commitCount,
              mergedPrCount: project.mergedPrCount,
              sourceCount: project.evidence.sources.length
            }))
          }, null, 2));
        }).catch(error => {
          console.error(`GitHub App access check failed: ${error.message}`);
          process.exitCode = 1;
        });
        NODE

  deploy-static:
    needs: verify
    environment: showcase-data
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      (github.event_name != 'workflow_dispatch' || !inputs.check_app_access)
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Check showcase credentials
      env:
        SHOWCASE_APP_CLIENT_ID: ${{ vars.SHOWCASE_APP_CLIENT_ID }}
        SHOWCASE_APP_PRIVATE_KEY: ${{ secrets.SHOWCASE_APP_PRIVATE_KEY }}
        COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      run: |
        node <<'NODE'
        const missing = ['SHOWCASE_APP_CLIENT_ID', 'SHOWCASE_APP_PRIVATE_KEY', 'COPILOT_GITHUB_TOKEN']
          .filter(name => !process.env[name]);
        if (missing.length) {
          console.error(`::error::Missing showcase configuration: ${missing.join(', ')}. Set the app Client ID variable, the showcase-data environment's private-key secret, and the Copilot credential.`);
          process.exitCode = 1;
        }
        NODE

    - name: Install generators and Copilot CLI
      run: |
        npm ci
        npm install --global @github/copilot@1.0.90 --no-fund --no-audit

    - name: Restore the last generated showcase
      uses: actions/cache/restore@v4
      with:
        path: static/data/github-showcase.json
        key: showcase-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          showcase-v1-${{ runner.os }}-

    - name: Create GitHub App token
      id: showcase-app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.SHOWCASE_APP_CLIENT_ID }}
        private-key: ${{ secrets.SHOWCASE_APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        permission-contents: read
        permission-pull-requests: read

    - name: Generate public project and contribution summaries
      env:
        GH_TOKEN: ${{ steps.showcase-app-token.outputs.token }}
        COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      run: npm run build-showcase

    - name: Cache the successful showcase snapshot
      uses: actions/cache/save@v4
      with:
        path: static/data/github-showcase.json
        key: showcase-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      
    - name: Inject Environment Variables
      run: |
        node <<'NODE'
        const fs = require('node:fs');
        const file = 'static/js/env-config.js';
        const source = fs.readFileSync(file, 'utf8');
        fs.writeFileSync(file, source.replaceAll(
          "'${AZURE_MAPS_SUBSCRIPTION_KEY}'",
          JSON.stringify(process.env.AZURE_MAPS_SUBSCRIPTION_KEY || '')
        ));
        NODE
      env:
        AZURE_MAPS_SUBSCRIPTION_KEY: ${{ secrets.AZURE_MAPS_SUBSCRIPTION_KEY }}
      
    - name: Setup Pages
      uses: actions/configure-pages@v5
      
    - name: Upload static files
      uses: actions/upload-pages-artifact@v3
      with:
        path: './static'
        
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: deploy-static
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      (github.event_name != 'workflow_dispatch' || !inputs.check_app_access) &&
      needs.deploy-static.result == 'success'
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      
    - name: Create deployment summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        echo "### ✅ Static Deployment Mode" >> $GITHUB_STEP_SUMMARY
        echo "- Deployed directly from \`static/\` folder" >> $GITHUB_STEP_SUMMARY
        echo "- No frontend build process required" >> $GITHUB_STEP_SUMMARY
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Deployment URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*Deployed automatically by GitHub Actions*" >> $GITHUB_STEP_SUMMARY
